name: Life Planner - daily messages

# GitHub's own `schedule:` trigger is unreliable under load (can be delayed hours,
# which used to make slot_for_now() misclassify a late-firing "morning" run as
# midday). The real trigger now comes from Cloudflare Cron Triggers calling this
# workflow's `workflow_dispatch` with an explicit slot, which is prompt and precise.
# The schedule below stays only as a safety net in case the Cloudflare trigger
# itself ever fails silently.

on:
  schedule:
    - cron: "30 7 * * *"    # ~08:30 London  (safety net only)
    - cron: "0 12 * * *"    # ~13:00 London  (safety net only)
    - cron: "0 16 * * *"    # ~17:00 London  (safety net only)
  workflow_dispatch:
    inputs:
      slot:
        description: "morning | midday | evening (omit to infer from time of day)"
        required: false
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      PHONE_NUMBER_ID: ${{ secrets.PHONE_NUMBER_ID }}
      MY_NUMBER: ${{ secrets.MY_NUMBER }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      VAULT_DRIVE_FOLDER_ID: ${{ secrets.VAULT_DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/run.py ${{ inputs.slot }}
